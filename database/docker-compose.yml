services:

  db:
    image: postgres
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}

    networks:
      - backend_network
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:
      - shared-volume:/var/lib/postgresql

  adminer:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8080:8080
    networks:
          - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  shared-volume:
    external: true