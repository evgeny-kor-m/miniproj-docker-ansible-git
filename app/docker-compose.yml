services:
  application-crm:
    container_name: app-crm
    # build:
    #   context: ..
    #   dockerfile: ./app/Dockerfile # Way to Dockerfile inside the context
    # image: app-crm-image # We obviously indicate the name of the image
    image: evgenykorchev/app-crm-image:v01
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database-server
      - DB_PORT=${env_DB_PORT}
      - DB_NAME=${env_DB_NAME}
      - DB_USER=${env_DB_USER}
      - DB_PASSWORD=${env_DB_PASSWORD}
    volumes:
      - app-data:/var/lib/volume
    restart: always

volumes:
  app-data:
    name: app-data