services:
  application-crm:
    container_name: app-crm
    # build:
    #   context: ..
    #   dockerfile: ./app/Dockerfile # Way to Dockerfile inside the context
    # image: app-crm-image # We obviously indicate the name of the image
    image: evgenykorchev/app-crm-image:v01
    # network_mode: "host" 
    ports:
      - "5000:${APP_PORT}"
    environment:
      - DB_HOST=database-server
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_PORT: 5000
    # volumes:
    #   - app-data:/volume-data
    restart: always
    networks:
      - app-network
  
  app-frontend:
    build:
      context: ..
      dockerfile: ./app/frontend/Dockerfile
    container_name: app-frontend
    restart: always
    environment:
      BACKEND_API_HOST: application-crm  # Backend service name
      BACKEND_API_PORT: 5000
      FRONTEND_PORT: 7000
      FLASK_ENV: production
    ports:
      - "7000:7000"
    networks:
      - app-network
    depends_on:
      - application-crm

networks:
  app-network:
    driver: bridge
volumes:
  app-data:
    name: app-data