services:
  application-crm:
    build:
      context: ..
      dockerfile: ./app/Dockerfile # Way to Dockerfile inside the context
    container_name: app-crm
    image: app-crm-image # We obviously indicate the name of the image
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - shared-volume:/var/shared
    restart: always

networks:
  default:
    external: true
    name: project-net

volumes:
  shared-volume:
    external: true