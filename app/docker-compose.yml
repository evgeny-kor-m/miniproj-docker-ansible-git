services:
  application-crm:
    container_name: app-crm
    # build:
    #   context: ..
    #   dockerfile: ./app/backend/Dockerfile # Way to Dockerfile inside the context
    image: evgenykorchev/app-crm-image:v02
    ports:
      - "5000:${APP_PORT}"

    extra_hosts:
      - "database-server:${DB_HOST}"  # ← IP come from .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_PORT=${APP_PORT}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 2
    restart: always
    networks:
      - app-network

  app-frontend:
    # build:
    #   context: ..
    #   dockerfile: ./app/frontend/Dockerfile
    # container_name: app-frontend
    image: evgenykorchev/app-frontend-image:v02 
    restart: always
    environment:
      BACKEND_API_HOST: application-crm  # Backend service name
      BACKEND_API_PORT: 5000
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "7000:7000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000"]
      interval: 30s
      timeout: 10s
      retries: 2
    networks:
      - app-network
    depends_on:
      - application-crm

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
    name: app-data