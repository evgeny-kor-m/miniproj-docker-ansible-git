- name: Configure UFW Firewall on All Servers
  hosts: slaves
  
  
  tasks:
    # =============== Common Setup (All Servers) ===============
    - name: Install UFW package
      apt:
        name: ufw
        state: present
        update_cache: yes
      become: yes
      
    - name: Reset UFW to clean state
      command: ufw --force reset
      become: yes
      changed_when: true
      
    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      become: yes
      loop:
        - { direction: 'incoming', policy: 'deny' }   # Deny all incoming by default
        - { direction: 'outgoing', policy: 'allow' }  
        - { direction: 'routed', policy: 'deny' }     
        
    # =============== Database Server Rules ===============
    - name: Database Server - Allow SSH from Master ONLY
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ master_server_ip }}"
        to_ip: "{{ db_server_ip }}"
        to_port: '22'
        proto: tcp
        comment: 'SSH from master-server only'
      become: yes
      
    - name: Database Server - Allow PostgreSQL from App Server ONLY
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ app_server_ip }}"
        to_ip: "{{ db_server_ip }}"
        to_port: '5432'
        proto: tcp
        comment: 'PostgreSQL from application-server only'
      become: yes
      
    - name: Database Server - Allow PgAdmin from Host/Gateway
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ gateway_ip }}"
        to_port: '8080'
        proto: tcp
        comment: 'PgAdmin web access from host'
      become: yes
      
    - name: Database Server - Log attempt block all incoming
      when: "'db_servers' in group_names"
      ufw:
        rule: deny
        direction: in
        log: yes
        comment: 'Log all denied incoming traffic'
      become: yes
      
    # =============== Application Server Rules ===============
    - name: Application Server - Allow SSH from Master ONLY
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ master_server_ip }}"
        to_ip: "{{ app_server_ip }}"
        to_port: '22'
        proto: tcp
        comment: 'SSH from master-server only'
      become: yes
      
    - name: Application Server - Allow Flask API (public)
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: '5000'
        proto: tcp
        comment: 'Flask API public endpoint'
      become: yes
      
    - name: Application Server - Allow Frontend (public)
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: '7000'
        proto: tcp
        comment: 'Frontend web interface'
      become: yes
      
    - name: Application Server - Allow outgoing to PostgreSQL ONLY
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ db_server_ip }}"
        to_port: '5432'
        proto: tcp
        comment: 'Outgoing to PostgreSQL on database-server'
      become: yes
      
    - name: Application Server - Deny other traffic to Database Server
      when: "'app_servers' in group_names"
      ufw:
        rule: deny
        direction: out
        to_ip: "{{ db_server_ip }}"
        comment: 'Block all other traffic to database-server'
      become: yes
      
    - name: Application Server -  Log attempt block all incoming
      when: "'app_servers' in group_names"
      ufw:
        rule: deny
        direction: in
        log: yes
        comment: 'Log all denied incoming traffic'
      become: yes
      
    # =============== Enable UFW on All Servers ===============
    - name: Enable UFW firewall
      ufw:
        state: enabled
        logging: 'on'
      become: yes
      
    - name: Display UFW status
      command: ufw status numbered
      register: ufw_status
      changed_when: false
      become: yes
      
    - name: Show firewall rules for verification
      debug:
        msg: "{{ ufw_status.stdout_lines }}"
        
    # =============== Logging ===============
    - name: Log firewall configuration event
      lineinfile:
        path: /home/ansible/firewall-deployment.log
        line: "{{ ansible_date_time.iso8601 }} - UFW configured on {{ inventory_hostname }} ({{ ansible_host }})"
        create: yes
        mode: '0644'
      delegate_to: localhost
      become: no