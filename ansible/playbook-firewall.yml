- name: Configure UFW Firewall on All Servers
  hosts: cluster
  become: true

  tasks:
    # ── Resolve DNS → IP ──
    - name: Resolve master-server IP
      shell: getent hosts master-server | awk '{print $1}'
      register: _master_ip
      changed_when: false

    - name: Resolve application-server IP
      shell: getent hosts application-server | awk '{print $1}'
      register: _app_ip
      changed_when: false

    - name: Resolve database-server IP
      shell: getent hosts database-server | awk '{print $1}'
      register: _db_ip
      changed_when: false

    - name: Resolve gateway IP
      shell: ip route | grep default | awk '{print $3}'
      register: _gateway_ip
      changed_when: false

    - name: Show resolved IPs
      debug:
        msg:
          - "master:  {{ _master_ip.stdout }}"
          - "app:     {{ _app_ip.stdout }}"
          - "db:      {{ _db_ip.stdout }}"
          - "gateway: {{ _gateway_ip.stdout }}"

    # ── Common Setup ──
    - name: Install UFW package
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Reset UFW to clean state
      command: ufw --force reset
      changed_when: true

    # ── ufw-docker: inject DOCKER-USER rules into after.rules ──  ← NEW
    - name: Install ufw-docker rules into after.rules
      when: "'slaves' in group_names"
      blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} UFW AND DOCKER"
        create: yes
        block: |
          *filter
          :ufw-user-forward - [0:0]
          :ufw-docker-logging-deny - [0:0]
          :DOCKER-USER - [0:0]
          -A DOCKER-USER -j ufw-user-forward
          -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN
          -A DOCKER-USER -m conntrack --ctstate INVALID -j DROP
          -A DOCKER-USER -i docker0 -o docker0 -j ACCEPT
          -A DOCKER-USER -j RETURN -s 10.0.0.0/8
          -A DOCKER-USER -j RETURN -s 172.16.0.0/12
          -A DOCKER-USER -j RETURN -s 192.168.0.0/16
          -A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 10.0.0.0/8
          -A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 172.16.0.0/12
          -A DOCKER-USER -j ufw-docker-logging-deny -m conntrack --ctstate NEW -d 192.168.0.0/16
          -A DOCKER-USER -j RETURN
          -A ufw-docker-logging-deny -m limit --limit 3/min --limit-burst 10 -j LOG --log-prefix "[UFW DOCKER BLOCK] "
          -A ufw-docker-logging-deny -j DROP
          COMMIT

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'deny' }
        - { direction: 'routed',   policy: 'deny' }

    - name: Outgoing Traffic (DNS, HTTP, HTTPS)
      ufw:
        rule: allow
        direction: out
        to_port: "{{ item }}"
        comment: 'Allow updates, Docker HUB access, and DNS resolution'
      loop:
        - '53'
        - '80'
        - '443'

    # ── Database Server Rules ──
    - name: Allow SSH from master
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _master_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH from master-server only'

    - name: Allow PostgreSQL from app
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _app_ip.stdout }}"
        to_port: 5432
        proto: tcp
        comment: 'From Application server only'

    - name: Allow PgAdmin from host
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _gateway_ip.stdout }}"
        to_port: 8080
        proto: tcp
        comment: 'pgAdmin from Host/Gateway only'

    # ── ufw route for Docker ports (db slave) ──  ← NEW
    - name: DB - Allow pgAdmin via ufw route (DOCKER-USER)
      when: "'db_servers' in group_names"
      command: ufw route allow proto tcp from any to any port 8080
      changed_when: true

    - name: DB - Allow Postgres via ufw route (DOCKER-USER)
      when: "'db_servers' in group_names"
      command: ufw route allow proto tcp from "{{ _app_ip.stdout }}" to any port 5432
      changed_when: true

    # ── Application Server Rules ──
    - name: Application Server - Allow SSH from Master ONLY
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _master_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH from master-server only'

    - name: Application Server - Allow Flask API
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: 5000
        proto: tcp
        comment: 'Flask API endpoint'

    - name: Application Server - Allow Frontend
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: 7000
        proto: tcp
        comment: 'Frontend web interface'

    - name: Application Server - Allow outgoing PostgreSQL
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _db_ip.stdout }}"
        to_port: 5432
        proto: tcp
        comment: 'Connect to PostgreSQL on database-server'

    # ── ufw route for Docker ports (app slave) ──  ← NEW
    - name: App - Allow Flask via ufw route (DOCKER-USER)
      when: "'app_servers' in group_names"
      command: ufw route allow proto tcp from any to any port 5000
      changed_when: true

    - name: App - Allow Frontend via ufw route (DOCKER-USER)
      when: "'app_servers' in group_names"
      command: ufw route allow proto tcp from any to any port 7000
      changed_when: true

    # ── Master Server Rules ──
    - name: Master Server - Allow SSH from Host/Gateway ONLY
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _gateway_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH management from host only'

    - name: Master Server - Allow outgoing SSH to Database Server
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _db_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH to database-server'

    - name: Master Server - Allow outgoing SSH to Application Server
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _app_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH to application-server'

    # ── Enable UFW ──
    - name: Enable UFW firewall
      ufw:
        state: enabled
        logging: 'on'

    - name: Display UFW status
      command: ufw status numbered
      register: ufw_status
      changed_when: false

    - name: Show firewall rules
      debug:
        msg: "{{ ufw_status.stdout_lines }}"

    # ── Logging ──
    - name: Log firewall configuration
      lineinfile:
        path: /home/ansible/log/ansible-firewall.log
        line: "{{ ansible_date_time.iso8601 }} - UFW configured on {{ inventory_hostname }}"
        create: yes
        mode: '0644'
      delegate_to: localhost
      become: no