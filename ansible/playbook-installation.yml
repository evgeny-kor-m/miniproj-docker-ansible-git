- name: Install infrastructure
  hosts: slaves
  become: yes

  tasks:
    - name: Dependency installation
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - git
          - fuse-overlayfs  # ← Добавлено здесь
        state: present
        update_cache: yes

    - name: Добавление GPG-ключа Docker
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Добавить репозиторий Docker
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Установить Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Создать конфиг Docker daemon
      copy:
        content: |
          {
            "storage-driver": "fuse-overlayfs",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      register: docker_config

    - name: Запустить Docker daemon s новым конфигом
      shell: |
        pkill dockerd || true
        sleep 2
        if ! pgrep -x dockerd > /dev/null; then
          nohup dockerd --host=unix:///var/run/docker.sock > /var/log/dockerd.log 2>&1 &
          sleep 5
        fi
      args:
        executable: /bin/bash

    - name: Подождать готовности Docker socket
      wait_for:
        path: /var/run/docker.sock
        state: present
        timeout: 60
      

    - name: Ensure ansible user is in docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Fix docker.sock permissions
      file:
        path: /var/run/docker.sock
        mode: '0666'
        owner: root
        group: docker

    - name: Проверить Docker version
      command: docker --version
      register: docker_version      
      become_user: ansible

    - name: Проверить Storage Driver
      shell: docker info | grep "Storage Driver"
      register: storage
      changed_when: false
      become_user: ansible

    - name: Show Installation Status
      debug:
        msg: 
          - "Docker version: {{ docker_version.stdout }}"
          - "Storage: {{ storage.stdout }}"

    - name: Add GitHub to known_hosts
      known_hosts:
        name: github.com
        key: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
        state: present

- name: Clone private repository
  hosts: slaves
  become: yes
  become_user: ansible
  
  tasks:
    - name: Убедиться, что целевая директория существует
      file:
        path: "{{ clone_dest }}"
        state: directory
        owner: "{{ ansible_user_name }}"
        group: "{{ ansible_user_name }}"
        mode: '0755'

    - name: Клонировать репозиторий
      git:
        repo: "{{ github_repo }}"
        dest: "{{ clone_dest }}"
        key_file: "{{ github_key_file }}"
        accept_hostkey: yes
        version: "{{ git_branch }}"
        force: yes
      tags: clone_repo
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ github_key_file }} -o StrictHostKeyChecking=no"

