- name: Configure UFW Firewall on All Servers
  hosts: cluster
  become: true

  tasks:
    # ── Resolve DNS → IP ──
    - name: Resolve master-server IP
      shell: getent hosts master-server | awk '{print $1}'
      register: _master_ip
      changed_when: false

    - name: Resolve application-server IP
      shell: getent hosts application-server | awk '{print $1}'
      register: _app_ip
      changed_when: false

    - name: Resolve database-server IP
      shell: getent hosts database-server | awk '{print $1}'
      register: _db_ip
      changed_when: false

    - name: Resolve gateway IP
      shell: ip route | grep default | awk '{print $3}'
      register: _gateway_ip
      changed_when: false

    - name: Show resolved IPs
      debug:
        msg:
          - "master:  {{ _master_ip.stdout }}"
          - "app:     {{ _app_ip.stdout }}"
          - "db:      {{ _db_ip.stdout }}"
          - "gateway: {{ _gateway_ip.stdout }}"

    # ── Common Setup ──
    - name: Install UFW package
      apt:
        name: ufw
        state: present
        update_cache: yes

    - name: Reset UFW to clean state
      command: ufw --force reset
      changed_when: true

    - name: Set UFW default policies
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'deny' }
        - { direction: 'routed',   policy: 'deny' }

    - name: Outgoing Traffic (DNS, HTTP, HTTPS)
      ufw:
        rule: allow
        direction: out
        to_port: "{{ item }}"
        comment: 'Allow updates, Docker HUB access, and DNS resolution'
      loop:
        - '53'
        - '80'
        - '443'

    # ── Database Server Rules ──
    - name: Allow SSH from master
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _master_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH from master-server only'

    - name: Allow PostgreSQL from app
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _app_ip.stdout }}"
        to_port: 5432
        proto: tcp
        comment: 'From Application server only'

    - name: Allow PgAdmin from host
      when: "'db_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _gateway_ip.stdout }}"
        to_port: 8080
        proto: tcp
        comment: 'pgAdmin from Host/Gateway only'

    # ── Application Server Rules ──
    - name: Application Server - Allow SSH from Master ONLY
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _master_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH from master-server only'

    - name: Application Server - Allow Flask API
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: 5000
        proto: tcp
        comment: 'Flask API endpoint'

    - name: Application Server - Allow Frontend
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: in
        to_port: 7000
        proto: tcp
        comment: 'Frontend web interface'

    - name: Application Server - Allow outgoing PostgreSQL
      when: "'app_servers' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _db_ip.stdout }}"
        to_port: 5432
        proto: tcp
        comment: 'Connect to PostgreSQL on database-server'

    # ── Master Server Rules ──
    - name: Master Server - Allow SSH from Host/Gateway ONLY
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: in
        from_ip: "{{ _gateway_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH management from host only'

    - name: Master Server - Allow outgoing SSH to Database Server
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _db_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH to database-server'

    - name: Master Server - Allow outgoing SSH to Application Server
      when: "'master' in group_names"
      ufw:
        rule: allow
        direction: out
        to_ip: "{{ _app_ip.stdout }}"
        to_port: 22
        proto: tcp
        comment: 'SSH to application-server'

    # ── Enable UFW ──
    - name: Enable UFW firewall
      ufw:
        state: enabled
        logging: 'on'

    - name: Display UFW status
      command: ufw status numbered
      register: ufw_status
      changed_when: false

    - name: Show firewall rules
      debug:
        msg: "{{ ufw_status.stdout_lines }}"

    # ── Logging ──
    - name: Log firewall configuration
      lineinfile:
        path: /home/ansible/log/ansible-firewall.log
        line: "{{ ansible_date_time.iso8601 }} - UFW configured on {{ inventory_hostname }}"
        create: yes
        mode: '0644'
      delegate_to: localhost
      become: no